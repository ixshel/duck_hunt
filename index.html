<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Duck Hunt Hand</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    canvas{display:block}
    .overlay{position:fixed;left:12px;top:12px;color:#fff;font:13px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:rgba(0,0,0,.45);padding:10px 12px;border-radius:12px;z-index:5;user-select:none}
    .overlay strong{color:#8ef}
    .footer{position:fixed;left:12px;bottom:12px;color:#fff;font:12px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:12px;z-index:5}
  </style>
</head>
<body>
  <div class="overlay">
    Hand: <strong id="handStatus">off</strong><br/>
    Pinch or close fist = shoot<br/>
    Mouse click also works as fallback
  </div>
  <div class="footer">Esc pause · R reload · M toggle mouse/hand</div>

  <canvas id="screen"></canvas>
  <video id="cam" playsinline style="display:none;"></video>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
